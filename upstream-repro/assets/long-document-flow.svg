<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
  <title id="title">大 PDF 遇到 32k 错误后的处理流程</title>
  <desc id="desc">PDF 上传后，发送消息时如果遇到明确的 32,768 token 错误，会去掉扩展字段重试一次。回答完成后，按需另取标题。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 10; }
      .new { fill: #ecfdf5; stroke: #10b981; }
      .warn { fill: #fff7ed; stroke: #f59e0b; }
      .end { fill: #eff6ff; stroke: #3b82f6; }
      .label { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; font-size: 15px; fill: #0f172a; }
      .small { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; font-size: 13px; fill: #475569; }
      .edge { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .yes { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; font-size: 13px; fill: #047857; }
      .no { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; font-size: 13px; fill: #b91c1c; }
    </style>
  </defs>

  <rect width="900" height="760" fill="#ffffff"/>
  <text x="24" y="32" class="label" font-size="20" font-weight="700">大 PDF 遇到 32k 错误后的处理流程</text>
  <text x="24" y="56" class="small">这一例同时启用了自动标题；后续消息遇到相同错误时也会走同一条重试路径。</text>

  <!-- A -->
  <rect x="40" y="90" width="330" height="64" class="box"/>
  <text x="60" y="118" class="label">1. 上传 PDF，发送一条消息</text>
  <text x="60" y="140" class="small">PDF 正常上传到 Files API，拿到 file_id</text>

  <!-- B -->
  <rect x="40" y="190" width="330" height="78" class="box"/>
  <text x="60" y="218" class="label">2. 这次请求同时带三个扩展字段</text>
  <text x="60" y="240" class="small">safety_check：高等级内容检查</text>
  <text x="60" y="258" class="small">title：自动标题；tools：联网搜索/读链接</text>

  <!-- C -->
  <rect x="40" y="310" width="330" height="78" class="warn"/>
  <text x="60" y="338" class="label">3. 原版收到 HTTP 400</text>
  <text x="60" y="360" class="small">user input too long,</text>
  <text x="60" y="378" class="small">63941 tokens exceeds max 32768 tokens</text>

  <!-- D: condition -->
  <rect x="40" y="440" width="330" height="78" class="box"/>
  <text x="60" y="468" class="label">4. 是这条特定长度错误，</text>
  <text x="60" y="490" class="label">且尚未输出任何内容？</text>
  <text x="60" y="510" class="small">错误文案匹配，且尚未收到内容块</text>

  <!-- No path -->
  <rect x="40" y="580" width="330" height="62" class="end"/>
  <text x="60" y="606" class="label">保持原有错误处理</text>
  <text x="60" y="628" class="small">不改变其他错误的行为</text>

  <!-- Retry -->
  <rect x="470" y="440" width="390" height="96" class="new"/>
  <text x="490" y="468" class="label">5. 用相同 messages 和 file_id 重试一次</text>
  <text x="490" y="490" class="small">去掉 safety_check、title、tools</text>
  <text x="490" y="510" class="small">不重新上传附件，模型和思考设置不变</text>

  <!-- Success -->
  <rect x="470" y="300" width="390" height="78" class="new"/>
  <text x="490" y="328" class="label">6. 200 且响应流成功结束，保存回答</text>
  <text x="490" y="350" class="small">这一次使用 API 默认的内容检查，</text>
  <text x="490" y="368" class="small">不启用联网搜索和链接阅读</text>

  <!-- Title -->
  <rect x="470" y="170" width="390" height="78" class="new"/>
  <text x="490" y="198" class="label">7. 若会话还没有标题</text>
  <text x="490" y="220" class="small">用「提问节选 + 回答节选 + 附件名」</text>
  <text x="490" y="238" class="small">另发一个短请求，带 title 生成标题</text>

  <!-- Result -->
  <rect x="470" y="80" width="390" height="58" class="end"/>
  <text x="490" y="106" class="label">8. 标题成功后更新会话</text>
  <text x="490" y="126" class="small">后台补标题不阻塞继续提问</text>

  <!-- Arrows -->
  <path d="M 205 154 L 205 190" class="edge"/>
  <path d="M 205 268 L 205 310" class="edge"/>
  <path d="M 205 388 L 205 440" class="edge"/>
  <path d="M 205 518 L 205 580" class="edge"/>
  <text x="220" y="552" class="no">否</text>

  <path d="M 370 479 L 470 479" class="edge"/>
  <text x="395" y="466" class="yes">是</text>

  <path d="M 665 440 L 665 378" class="edge"/>
  <path d="M 665 300 L 665 248" class="edge"/>
  <path d="M 665 170 L 665 138" class="edge"/>

  <!-- Note -->
  <rect x="40" y="680" width="820" height="56" fill="#f1f5f9" stroke="#cbd5e1" rx="8"/>
  <text x="60" y="704" class="small">只对 32,768 token 这条错误重试一次，继续使用原消息和附件引用。</text>
  <text x="60" y="724" class="small">若重试也失败，按原错误处理；补标题失败时已保存的正文仍可阅读。</text>
</svg>
