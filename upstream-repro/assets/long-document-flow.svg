<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc">
  <title id="title">大 PDF 遇到 32k 错误后的处理流程</title>
  <desc id="desc">上传 PDF 后发送消息；如果请求带扩展字段并返回 32k 错误，且尚未输出内容，则去掉三个字段重试一次；成功后显示回答，必要时用短请求生成标题。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
      .warn { fill: #fff7ed; stroke: #f97316; }
      .fix { fill: #ecfdf5; stroke: #10b981; }
      .later { fill: #f0fdf4; stroke: #86efac; }
      .title { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; font-size: 19px; font-weight: 600; fill: #0f172a; }
      .sub { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; font-size: 15px; fill: #475569; }
      .note { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; font-size: 14px; fill: #64748b; }
      .arrow { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="800" height="720" fill="#ffffff"/>
  <text x="40" y="42" class="title">大 PDF 遇到 32k 错误后的处理流程</text>
  <text x="40" y="70" class="note">只有满足条件的 32,768 token 错误才会触发自动重试。</text>

  <!-- 1 -->
  <rect x="140" y="100" width="520" height="64" rx="10" class="box"/>
  <text x="400" y="126" text-anchor="middle" class="title">上传 PDF，发送消息</text>
  <text x="400" y="148" text-anchor="middle" class="sub">文件上传成功</text>

  <!-- 2 -->
  <rect x="140" y="202" width="520" height="64" rx="10" class="box"/>
  <text x="400" y="228" text-anchor="middle" class="title">请求带三个扩展字段</text>
  <text x="400" y="250" text-anchor="middle" class="sub">safety_check · title · tools</text>

  <!-- 3 -->
  <rect x="140" y="304" width="520" height="64" rx="10" class="warn"/>
  <text x="400" y="330" text-anchor="middle" class="title">HTTP 400</text>
  <text x="400" y="352" text-anchor="middle" class="sub">输入超过 32,768 tokens</text>

  <!-- 4 -->
  <rect x="140" y="406" width="520" height="76" rx="10" class="fix"/>
  <text x="400" y="432" text-anchor="middle" class="title">去掉三个字段，重试一次</text>
  <text x="400" y="454" text-anchor="middle" class="sub">仅在尚未输出内容时；复用同一附件</text>

  <!-- 5 -->
  <rect x="140" y="520" width="520" height="64" rx="10" class="fix"/>
  <text x="400" y="546" text-anchor="middle" class="title">HTTP 200</text>
  <text x="400" y="568" text-anchor="middle" class="sub">显示并保存回答</text>

  <!-- 6 -->
  <rect x="140" y="622" width="520" height="64" rx="10" class="later" stroke-dasharray="6 4"/>
  <text x="400" y="648" text-anchor="middle" class="title">需要标题时</text>
  <text x="400" y="670" text-anchor="middle" class="sub">用单独短请求生成标题</text>

  <!-- arrows -->
  <path d="M 400 164 L 400 202" class="arrow"/>
  <path d="M 400 266 L 400 304" class="arrow"/>
  <path d="M 400 368 L 400 406" class="arrow"/>
  <path d="M 400 482 L 400 520" class="arrow"/>
  <path d="M 400 584 L 400 622" class="arrow"/>
</svg>
